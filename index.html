<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111920">
  <meta name="description" content="Controle pessoal de demandas, projetos e calendário.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/persona.svg">
  <title>Orizon Persona — Controle pessoal</title>
  <style>
    :root{--bg:#f1f4f6;--panel:#ffffff;--panel2:#f7f9fa;--line:#d9e0e5;--text:#17202b;--muted:#6d7986;--violet:#9bf12f;--violet2:#75c51d;--amber:#e7a318;--red:#e52b2f;--green:#22a95a;--blue:#13adc7;--gray:#718096;--shadow:0 18px 45px #17202b17;--r:16px}

    .app{min-height:100vh;display:grid;grid-template-columns:246px 1fr;transition:grid-template-columns .22s}.side{position:sticky;top:0;height:100vh;padding:26px 18px;background:#111920;border-right:1px solid #26313a;display:flex;flex-direction:column;z-index:5;overflow:hidden;transition:padding .22s}.brand{display:flex;align-items:center;gap:12px;padding:0 6px 28px;white-space:nowrap}.brand-copy{min-width:0}.logo{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:2px solid #9aa6af;background:#182129;display:grid;place-items:center;color:var(--violet);font-weight:900;font-size:15px;letter-spacing:-1px;box-shadow:inset 0 0 0 6px #111920}.brand b{color:#fff;font-size:19px;letter-spacing:3px}.brand small{display:block;color:#84919c;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-top:3px}.collapse-menu{margin-left:auto;border:1px solid #34414a;background:#1c272f;color:#aab5bd;border-radius:9px;width:30px;height:30px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#99a2aa;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;text-align:left;font-size:14px;white-space:nowrap}.nav button:hover{background:#ffffff08;color:#fff}.nav button.active{background:#9bf12f18;color:#b6fa62;font-weight:800;box-shadow:inset 3px 0 0 var(--violet)}.nav .ico{flex:0 0 22px;width:22px;text-align:center;font-size:17px}.nav .count{margin-left:auto;background:#24302d;padding:2px 8px;border-radius:20px;font-size:11px;color:#b6fa62}.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid #2a343c}.backup-state{font-size:12px;color:#8e9aa4;line-height:1.45;white-space:nowrap}.backup-state.warn{color:#ffd180}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--violet);margin-right:7px}.warn .dot{background:var(--amber)}.app.sidebar-collapsed{grid-template-columns:78px 1fr}.sidebar-collapsed .side{padding-left:11px;padding-right:11px}.sidebar-collapsed .brand-copy,.sidebar-collapsed .nav .nav-label,.sidebar-collapsed .nav .count,.sidebar-collapsed .backup-state span:last-child{display:none}.sidebar-collapsed .collapse-menu{position:absolute;top:75px;left:24px;transform:rotate(180deg)}.sidebar-collapsed .nav button{justify-content:center;padding-left:10px;padding-right:10px}.sidebar-collapsed .side-foot{text-align:center}.sidebar-collapsed .timer-dock{left:108px}
    .main{min-width:0}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 30px;position:sticky;top:0;background:#ffffffef;backdrop-filter:blur(16px);z-index:4}.mobile-menu{display:none}.search{flex:1;max-width:620px;position:relative}.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);padding:0 42px 0 15px;outline:none}.search input:focus{border-color:var(--violet);box-shadow:0 0 0 3px #9bf12f22}.search span{position:absolute;right:14px;top:10px;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;padding:10px 14px;font-weight:700}.btn:hover{border-color:#b7c0c7;background:#f7f9fa}.btn.primary{border-color:#86d924;background:var(--violet);color:#15200b}.btn.install{border-color:#aab5bd;background:#111920;color:#fff;white-space:nowrap}.btn.install:hover{background:#202b33}.btn.ghost{background:transparent}.btn.danger{border-color:#f0c6c8;color:#c72027;background:#fff5f5}.btn.small{padding:7px 10px;font-size:13px}.content{padding:30px 30px 110px;max-width:1540px;margin:auto}.view{display:none}.view.active{display:block}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.heading h1{font-size:28px;margin:0 0 6px;letter-spacing:-.6px}.heading p{margin:0;color:var(--muted);font-size:14px}.date-pill{color:#547e20;background:#9bf12f18;border:1px solid #8bd82e66;border-radius:999px;padding:8px 12px;font-size:13px;white-space:nowrap}
    .kpis{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:13px;margin-bottom:24px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;box-shadow:0 8px 24px #17202b0a}.kpi:before{content:"";position:absolute;left:72%;right:0;bottom:0;height:4px;background:var(--tone,var(--violet))}.kpi:after{content:"";position:absolute;inset:auto -25px -32px auto;width:85px;height:85px;border-radius:50%;background:var(--tone,#777);opacity:.05}.kpi span{color:var(--muted);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}.kpi strong{display:block;font-size:28px;margin-top:8px}.kpi em{font-style:normal;font-size:11px;color:var(--tone);font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.8fr);gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px #17202b0a}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 19px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:16px;margin:0}.panel-head small{color:var(--muted)}.queue{padding:5px 12px 13px}.task{display:grid;grid-template-columns:7px minmax(0,1fr) auto;gap:13px;padding:15px 8px;border-bottom:1px solid var(--line);align-items:center}.task:last-child{border:0}.urgency{height:44px;border-radius:99px;background:var(--tone,var(--gray))}.task h3{font-size:15px;margin:0 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}.tag{border-radius:999px;padding:4px 8px;background:#eef2f4;color:#5e6b76}.tag.high{background:#e52b2f14;color:#bd2227}.tag.medium{background:#e7a31818;color:#9d6c09}.tag.low{background:#22a95a14;color:#188044}.tag.overdue{background:#e52b2f14;color:#bd2227}.tag.soon{background:#e7a31818;color:#9d6c09}.task-actions{display:flex;gap:6px;opacity:.7}.task:ho     .focus{padding:18px}.focus-card{background:linear-gradient(145deg,#f8fdef,#f1f8e8);border:1px solid #cceaa6;border-radius:14px;padding:18px;margin-bottom:12px}.focus-card .label{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#639d1d;font-weight:800}.focus-card h3{margin:11px 0 8px;font-size:17px}.focus-card p{color:var(--muted);font-size:13px;margin:0 0 15px;line-height:1.5}.progress{height:7px;background:#e4e9ec;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--violet2),var(--violet));border-radius:inherit}.focus-buttons{display:flex;gap:8px;margin-top:15px}.blocked-list{padding:10px 18px 18px}.blocked-item{padding:12px 0;border-bottom:1px solid var(--line)}.blocked-item:last-child{border:0}.blocked-item b{font-size:13px}.blocked-item small{display:block;color:#9d6c09;margin-top:5px}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar select,.toolbar input{height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);padding:0 12px;outline:none}.toolbar .spacer{flex:1}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:0 8px 24px #17202b0a}table{width:100%;border-collapse:collapse;min-width:1030px}th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;padding:14px;border-bottom:1px solid var(--line);background:#f4f6f7}td{padding:14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}tr:last-child td{border:0}tr:hover td{background:#fafcf8}.title-cell b{display:block;font-size:14px}.title-cell small{display:block;color:var(--muted);margin-top:4px;max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:#eef2f4;color:#5f6c77;white-space:nowrap}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.in-progress{color:#0e8296;background:#13adc718}.status.blocked{color:#9d6c09;background:#e7a31818}.status.done{color:#188044;background:#22a95a16}.status.review{color:#5c8429;background:#9bf12f22}.row-actions{display:flex;gap:5px}.linkish{color:#618d2c;text-decoration:none}.linkish:hover{text-decoration:underline}
    .project-grid{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:15px}.project-card{padding:19px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}.project-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.project-head h3{margin:0;font-size:16px}.project-actions{display:flex;gap:5px}.project-card p{color:var(--muted);font-size:13px;line-height:1.5;min-height:40px}.project-stats{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:16px}.project-stats b{color:var(--text)}
    .calendar{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.cal-head{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.cal-controls{display:flex;align-items:center;gap:8px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}.cal-name{padding:10px;color:var(--muted);font-size:12px;text-align:center;background:#f4f6f7}.cal-day{min-height:112px;padding:9px;border:0;border-top:1px solid var(--line);border-right:1px solid var(--line);position:relative;background:#fff;text-align:left;overflow:hidden}.cal-day:hover{background:#f7fceb;box-shadow:inset 0 0 0 2px #9bf12f66}.cal-day.muted{opacity:.45}.cal-day.today{background:#9bf12f10}.day-num{font-size:12px;color:var(--muted)}.day-add{float:right;color:#66962d;opacity:0;font-weight:900}.cal-day:hover .day-add{opacity:1}.cal-chip{display:block;margin-top:7px;padding:5px 6px;border-radius:6px;background:#eef2f4;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--tone,var(--violet))}.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 4px}.pagination-controls{display:flex;align-items:center;gap:6px}.pagination .btn[disabled]{opacity:.45;cursor:not-allowed}.page-size{height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 8px}.sync-state{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.sync-state.ok{color:var(--green)}.sync-state.error{color:var(--red)}
    .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.chart{padding:20px}.chart h3{font-size:15px;margin:0 0 20px}.bar-row{display:grid;grid-template-columns:125px 1fr 32px;gap:10px;align-items:center;margin:12px 0;font-size:12px;color:var(--muted)}.bar{height:10px;background:#e3e8eb;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--tone,var(--violet));border-radius:inherit}.donut-wrap{display:flex;align-items:center;justify-content:center;gap:30px;min-height:230px}.donut{width:165px;height:165px;border-radius:50%;background:conic-gradient(var(--green) 0 var(--done),var(--blue) var(--done) var(--doing),var(--amber) var(--doing) var(--blocked),#cdd5da var(--blocked) 100%);position:relative}.donut:after{content:"";position:absolute;inset:27px;border-radius:50%;background:var(--panel)}.donut-center{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center}.donut-center b{font-size:26px}.legend{display:grid;gap:10px;font-size:12px;color:var(--muted)}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tone);margin-right:8px}
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.setting{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}.setting h3{margin:0 0 8px;font-size:16px}.setting p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.6}.setting-actions{display:flex;gap:9px;flex-wrap:wrap}.storage-bar{height:8px;background:#e3e8eb;border-radius:20px;overflow:hidden;margin:16px 0 7px}.storage-bar i{display:block;height:100%;width:20%;background:var(--violet)}
    .timer-dock{position:fixed;left:276px;right:30px;bottom:22px;max-width:780px;margin:auto;background:#111920f2;color:#fff;border:1px solid #3a474f;border-radius:16px;box-shadow:0 20px 65px #17202b55;padding:13px 15px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;z-index:12;backdrop-filter:blur(16px)}.timer-pulse{width:12px;height:12px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 7px #9bf12f24;animation:pulse 1.6s infinite}.timer-dock.paused .timer-pulse{background:var(--amber);box-shadow:none;animation:none}.timer-copy{min-width:0}.timer-copy b,.timer-copy small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timer-copy small{color:#9ba6ae;margin-top:3px;font-size:12px}.timer-clock{font-size:24px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:.5px}.timer-controls{display:flex;gap:7px}.timer-dock .btn{background:#202a31;color:#fff;border-color:#3a474f}.timer-dock .btn.primary{background:var(--violet);color:#17200e;border-color:var(--violet)}@keyframes pulse{50%{box-shadow:0 0 0 12px #9bf12f00}}
    dialog{border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--text);padding:0;width:min(760px,calc(100vw - 28px));box-shadow:var(--shadow)}dialog::backdrop{background:#10182088;backdrop-filter:blur(5px)}.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0;font-size:19px}.close{border:0;background:transparent;color:var(--muted);font-size:24px}.form{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#586570;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px #9bf12f22}.field textarea{min-height:75px;resize:vertical}.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.toast{position:fixed;right:24px;bottom:24px;background:#111920;color:#fff;border:1px solid #3a474f;border-radius:12px;padding:13px 16px;box-shadow:var(--shadow);transform:translateY(120px);opacity:0;transition:.25s;z-index:20;font-size:13px}.toast.show{transform:none;opacity:1}.hidden{display:none!important}
    @media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.project-grid{grid-template-columns:repeat(2,1fr)}.dash-grid{grid-template-columns:1fr}}
    @media(max-width:760px){.app,.app.sidebar-collapsed{display:block}.side{position:fixed;left:-260px;transition:.25s;width:246px;padding:26px 18px}.side.open{left:0;box-shadow:30px 0 70px #000b}.collapse-menu{display:none}.sidebar-collapsed .brand-copy,.sidebar-collapsed .nav .nav-label,.sidebar-collapsed .nav .count,.sidebar-collapsed .backup-state span:last-child{display:initial}.sidebar-collapsed .nav button{justify-content:flex-start}.top{padding:0 15px;gap:8px}.mobile-menu{display:block}.content{padding:20px 14px 120px}.top .btn.primary span,.top .btn.install span{display:none}.kpis{grid-template-columns:1fr 1fr}.project-grid,.settings-grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.heading{align-items:center}.heading h1{font-size:24px}.cal-day{min-height:82px}.cal-chip{font-size:0;height:8px;padding:0}.donut-wrap{flex-direction:column}.timer-dock,.sidebar-collapsed .timer-dock{left:12px;right:12px;bottom:12px;grid-template-columns:auto 1fr auto}.timer-clock{grid-column:2;font-size:20px}.timer-controls{grid-column:3;grid-row:1/3;flex-direction:column}.timer-controls .btn{padding:7px 9px;font-size:12px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side" id="sidebar">
    <div class="brand"><div class="logo">OP</div><div class="brand-copy"><b>Orizon</b><small>Persona</small></div><button class="collapse-menu" id="collapseMenu" title="Recolher menu" aria-label="Recolher menu">‹</button></div>
    <nav class="nav" id="nav">
      <button data-view="today" class="active" title="Hoje"><span class="ico">◉</span><span class="nav-label">Hoje</span><span class="count" id="navToday">0</span></button>
      <button data-view="tasks" title="Demandas"><span class="ico">☷</span><span class="nav-label">Demandas</span><span class="count" id="navTasks">0</span></button>
      <button data-view="recurring" title="Periódicas"><span class="ico">↻</span><span class="nav-label">Periódicas</span></button>
      <button data-view="projects" title="Projetos"><span class="ico">◇</span><span class="nav-label">Projetos</span></button>
      <button data-view="calendar" title="Calendário"><span class="ico">□</span><span class="nav-label">Calendário</span></button>
      <button data-view="blocked" title="Bloqueadas"><span class="ico">⊘</span><span class="nav-label">Bloqueadas</span><span class="count" id="navBlocked">0</span></button>
      <button data-view="done" title="Concluídas"><span class="ico">✓</span><span class="nav-label">Concluídas</span></button>
      <button data-view="dashboard" title="Dashboard"><span class="ico">▥</span><span class="nav-label">Dashboard</span></button>
      <button data-view="settings" title="Configurações"><span class="ico">⚙</span><span class="nav-label">Configurações</span></button>
    </nav>
    <div class="side-foot"><div class="backup-state" id="backupState"><span class="dot"></span><span>Banco salvo neste navegador</span></div></div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="btn ghost mobile-menu" id="menuBtn">☰</button>
      <div class="search"><input id="globalSearch" placeholder="Pesquisar demandas, projetos e sistemas…"><span>⌕</span></div>
      <button class="btn install" id="installAppBtn" title="Instalar na área de trabalho">⇩ <span>Instalar no PC</span></button>
      <button class="btn primary" id="newTaskBtn">＋ <span>Nova demanda</span></button>
    </header>
    <div class="content">
      <section class="view active" id="view-today"></section>
      <section class="view" id="view-tasks"></section>
      <section class="view" id="view-recurring"></section>
      <section class="view" id="view-projects"></section>
      <section class="view" id="view-calendar"></section>
      <section class="view" id="view-blocked"></section>
      <section class="view" id="view-done"></section>
      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-settings"></section>
    </div>
  </main>
</div>

<div class="timer-dock hidden" id="timerDock" aria-live="polite"></div>

<dialog id="taskDialog">
  <form id="taskForm" method="dialog">
    <div class="modal-head"><h2 id="modalTitle">Nova demanda</h2><button type="button" class="close" data-close>×</button></div>
    <div class="form">
      <input type="hidden" name="id">
      <div class="field full"><label>Título *</label><input name="title" required maxlength="140" placeholder="Ex.: Revisão periódica do sistema Antares"></div>
      <div class="field"><label>Projeto / Sistema</label><input name="project" list="projectList" placeholder="Ex.: Antares Vision"><datalist id="projectList"></datalist></div>
      <div class="field"><label>Categoria</label><select name="category"><option>Revisão periódica</option><option>Qualificação</option><option>Revalidação</option><option>Documento</option><option>CAPA</option><option>Gestão de acesso</option><option>Backup / Restore</option><option>Reunião</option><option>Outra</option></select></div>
      <div class="field"><label>Status</label><select name="status"><option value="planned">Planejada</option><option value="in-progress">Em andamento</option><option value="review">Aguardando revisão</option><option value="blocked">Bloqueada</option><option value="done">Concluída</option></select></div>
      <div class="field"><label>Prioridade</label><select name="priority"><option value="high">Alta</option><option value="medium" selected>Média</option><option value="low">Baixa</option></select></div>
      <div class="field"><label>Data prevista</label><input type="date" name="dueDate"></div>
      <div class="field"><label>Periodicidade</label><select name="recurrence"><option value="none">Não se repete</option><option value="monthly">Mensal</option><option value="quarterly">Trimestral</option><option value="semiannual">Semestral</option><option value="annual">Anual</option><option value="biennial">Bienal</option><option value="triennial">Trienal</option></select></div>
      <div class="field"><label>Progresso (%)</label><input type="number" name="progress" min="0" max="100" value="0"></div>
      <div class="field"><label>Responsável</label><input name="owner" value="Arthur"></div>
      <div class="field"><label>Solicitante</label><input name="requester" placeholder="Quem solicitou a demanda"></div>
      <div class="field"><label>Área</label><input name="department" placeholder="Ex.: Qualidade, Automação"></div>
      <div class="field"><label>Data de início</label><input type="date" name="startDate"></div>
      <div class="field"><label>Estimativa (horas)</label><input type="number" name="estimatedHours" min="0" step="0.5" placeholder="Ex.: 8"></div>
      <div class="field"><label>Origem</label><select name="source"><option value="manual">Manual</option><option value="orizon">Orizon</option><option value="email">E-mail</option><option value="meeting">Reunião</option><option value="audit">Auditoria</option><option value="other">Outra</option></select></div>
      <div class="field"><label>Etiquetas</label><input name="tags" placeholder="Ex.: urgente, validação"></div>
      <div class="field full"><label>Próxima ação</label><input name="nextAction" placeholder="A menor ação necessária para fazer a demanda andar"></div>
      <div class="field full"><label>Bloqueio / Dependência</label><input name="blocker" placeholder="Ex.: aguardando retorno da Automação"></div>
      <div class="field full"><label>Caminho do documento ou pasta</label><input name="documentPath" placeholder="Ex.: P:\\Validação\\Antares\\Revisão 2026"></div>

    </div>
    <div class="modal-foot"><button type="button" class="btn" data-close>Cancelar</button><button class="btn" type="submit" name="continue" value="yes">Salvar e criar outra</button><button class="btn primary" type="submit">Salvar demanda</button></div>
  </form>
</dialog>
<dialog id="projectDialog">

<script>
(() => {
  'use strict';
  const KEY='persona-db-v1';
  const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const today=()=>new Date().toISOString().slice(0,10);
  const uid=()=>globalThis.crypto?.randomUUID?.()||`per_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,12)}`;
  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'Sem data';
  const labels={planned:'Planejada','in-progress':'Em andamento',review:'Aguardando revisão',blocked:'Bloqueada',done:'Concluída',high:'Alta',medium:'Média',low:'Baixa',monthly:'Mensal',quarterly:'Trimestral',semiannual:'Semestral',annual:'Anual',biennial:'Bienal',triennial:'Trienal',none:'Não se repete'};
  const tone={high:'#e52b2f',medium:'#e7a318',low:'#22a95a',overdue:'#e52b2f',soon:'#e7a318',normal:'#9bf12f',done:'#22a95a',blocked:'#718096',red:'#e52b2f',amber:'#e7a318',blue:'#13adc7',gray:'#718096',violet:'#9bf12f',green:'#22a95a'};
  const plusDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
  const seed=()=>({version:1,meta:{createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),lastBackupAt:null,demo:true},settings:{owner:'Arthur',theme:'dark'},projects:[
    {id:'p1',name:'Antares Vision',description:'SCADA 6.2 / PC4400',color:'#9bf12f'},
    {id:'p2',name:'Fabrima VPF8-120',description:'Encartuchadora — Sólidos P01',color:'#13adc7'},
    {id:'p3',name:'Governança VSC',description:'Procedimentos, inventário e rotinas corporativas',color:'#22a95a'}
  ],tasks:[
    {id:'t1',title:'Revisão periódica do sistema Antares',project:'Antares Vision',category:'Revisão periódica',status:'in-progress',priority:'high',dueDate:plusDays(-11),recurrence:'annual',progress:65,nextAction:'Finalizar avaliação de trilha e logs',blocker:'',owner:'Arthur',documentPath:'',notes:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
    {id:'t2',title:'Encerramento da CAPA de alarmes',project:'Fabrima VPF8-120',category:'CAPA',status:'in-progress',priority:'high',dueDate:plusDays(2),recurrence:'none',progress:90,nextAction:'Anexar evidências e enviar para aprovação',blocker:'',owner:'Arthur',documentPath:'',notes:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
    {id:'t3',title:'Teste periódico de backup e restore',project:'Antares Vision',category:'Backup / Restore',status:'blocked',priority:'high',dueDate:plusDays(27),recurrence:'semiannual',progress:20,nextAction:'Agendar janela com Automação',blocker:'Disponibilidade da Automação',owner:'Arthur',documentPath:'',notes:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
    {id:'t4',title:'Revisão periódica da encartuchadora',project:'Fabrima VPF8-120',category:'Revisão periódica',status:'planned',priority:'medium',dueDate:plusDays(45),recurrence:'annual',progress:5,nextAction:'Solicitar histórico de manutenção',blocker:'',owner:'Arthur',documentPath:'',notes:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
    {id:'t5',title:'Atualizar inventário de sistemas VSC',project:'Governança VSC',category:'Documento',status:'done',priority:'medium',dueDate:plusDays(-35),recurrence:'semiannual',progress:100,nextAction:'',blocker:'',owner:'Arthur',documentPath:'',notes:'Exemplo concluído.',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),completedAt:new Date().toISOString()}
  ],history:[]});
  let db=load(); let currentView='today'; let search=''; let calDate=new Date(); let tablePage=1; let pageSize=10; let linkedHandle=null; let linkedStatus='disconnected'; let linkedWriteTimer; let linkedWriteChain=Promise.resolve(); let deferredInstallPrompt=null;
  function load(){try{const v=localStorage.getItem(KEY),data=v?JSON.parse(v):seed();data.meta=data.meta||{};data.settings={owner:'Arthur',...data.settings};data.projects=data.projects||[];data.tasks=data.tasks||[];data.history=data.history||[];return data}catch(e){return seed()}}
  function save(message){db.meta.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(db));if(message)toast(message)}catch(e){toast('Não foi possível salvar no navegador. Exporte um backup JSON.')}scheduleLinkedWrite();renderNav();renderTimerDock()}
  function log(type,task,detail=''){db.history.unshift({id:uid(),type,taskId:task.id,title:task.title,detail,at:new Date().toISOString()});db.history=db.history.slice(0,500)}
  function days(t){if(!t.dueDate)return 9999;return Math.floor((new Date(t.dueDate+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000)}
  function urgency(t){if(t.status==='done')return 9000;let d=days(t),score=d<0?d:d<=30?100+d:d<=60?200+d:300+Math.min(d,999);score+=t.priority==='high'?-30:t.priority==='medium'?-10:0;score+=t.status==='blocked'?20:0;return score}
  function activeTasks(){return db.tasks.filter(t=>t.status!=='done').sort((a,b)=>urgency(a)-urgency(b))}
  function dueClass(t){const d=days(t);return d<0?'overdue':d<=30?'soon':'normal'}
  function dueText(t){const d=days(t);if(!t.dueDate)return 'Sem vencimento';if(d<0)return `${Math.abs(d)} dia${Math.abs(d)!==1?'s':''} em atraso`;if(d===0)return 'Vence hoje';if(d===1)return 'Vence amanhã';return `Vence em ${d} dias`}
  function elapsedMs(t){const timer=t?.timer||{},base=+timer.accumulatedMs||0;if(!timer.running||!timer.startedAt)return base;return base+Math.max(0,Date.now()-new Date(timer.startedAt).getTime())}
  function fmtDuration(ms){const total=Math.floor(Math.max(0,ms)/1000),h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=total%60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':')}
  function freezeTimer(t){if(!t?.timer?.running)return;t.timer.accumulatedMs=elapsedMs(t);t.timer.running=false;t.timer.startedAt=null}
  function activeTimer(){const id=db.settings?.activeTimerTaskId;return db.tasks.find(t=>t.id===id)||db.tasks.find(t=>t.timer?.running)}
  function startTimer(t){db.settings=db.settings||{};db.tasks.forEach(x=>{if(x.id!==t.id&&x.timer?.running)freezeTimer(x)});t.timer=t.timer||{running:false,startedAt:null,accumulatedMs:0};if(!t.timer.running){t.timer.running=true;t.timer.startedAt=new Date().toISOString()}t.status='in-progress';t.progress=Math.max(5,+t.progress||0);t.updatedAt=new Date().toISOString();db.settings.activeTimerTaskId=t.id;log('timer-start',t,'Cronômetro iniciado');save('Cronômetro iniciado');render()}
  function pauseTimer(t){freezeTimer(t);t.updatedAt=new Date().toISOString();log('timer-pause',t,'Cronômetro pausado');save('Cronômetro pausado');render()}
  function stopTimer(t){freezeTimer(t);if(db.settings?.activeTimerTaskId===t.id)db.settings.activeTimerTaskId=null;t.updatedAt=new Date().toISOString();log('timer-stop',t,`Apontamento encerrado em ${fmtDuration(elapsedMs(t))}`);save('Apontamento encerrado');render()}
  function renderTimerDock(){const dock=$('#timerDock');if(!dock)return;const t=activeTimer();if(!t){dock.classList.add('hidden');dock.innerHTML='';return}dock.classList.remove('hidden');dock.classList.toggle('paused',!t.timer?.running);dock.innerHTML=`<span class="timer-pulse"></span><div class="timer-copy"><b>${esc(t.title)}</b><small>${t.timer?.running?'Em foco agora':'Cronômetro pausado'} · ${esc(t.project||'Sem projeto')}</small></div><strong class="timer-clock">${fmtDuration(elapsedMs(t))}</strong><div class="timer-controls"><button class="btn small" data-timer-action="${t.timer?.running?'pause':'resume'}">${t.timer?.running?'Pausar':'Retomar'}</button><button class="btn small" data-timer-action="stop">Encerrar</button><button class="btn primary small" data-timer-action="complete">Concluir</button></div>`}
  function taskTone(t){return t.status==='blocked'?tone.blocked:tone[dueClass(t)]}
  function statusHtml(s){return `<span class="status ${s}">${labels[s]||s}</span>`}
  function priorityHtml(p){return `<span class="tag ${p}">${labels[p]}</span>`}
  function taskQueue(t){const timed=elapsedMs(t)>0?`<span class="tag">⏱ ${fmtDuration(elapsedMs(t))}</span>`:'';return `<article class="task" data-id="${t.id}"><i class="urgency" style="--tone:${taskTone(t)}"></i><div><h3>${esc(t.title)}</h3><div class="meta"><span>${esc(t.project||'Sem projeto')}</span><span class="tag ${dueClass(t)}">${dueText(t)}</span>${priorityHtml(t.priority)}${timed}${t.blocker?`<span class="tag">Bloqueio: ${esc(t.blocker)}</span>`:''}</div></div><div class="task-actions"><button class="icon-btn" title="Iniciar cronômetro" data-action="start">▶</button><button class="icon-btn" title="Editar" data-action="edit">✎</button><button class="icon-btn" title="Concluir" data-action="complete">✓</button></div></article>`}
  function empty(title,text){return `<div class="empty"><strong>${title}</strong>${text}</div>`}
  function heading(title,desc,extra=''){return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${extra}</div>`}
  function renderNav(){const a=activeTasks();$('#navToday').textContent=a.filter(t=>days(t)<=30||t.status==='in-progress'||t.status==='blocked').length;$('#navTasks').textContent=a.length;$('#navBlocked').textContent=a.filter(t=>t.status==='blocked').length;const b=$('#backupState'),last=db.meta.lastBackupAt;if(linkedHandle){b.className=`backup-state ${linkedStatus==='error'||linkedStatus==='permission'?'warn':''}`;b.innerHTML=`<span class="dot"></span><span>${linkedStatus==='saved'?'Banco vinculado':linkedStatus==='saving'?'Salvando banco…':linkedStatus==='permission'?'Banco requer permissão':'Falha no banco'}</span>`}else if(!last||Date.now()-new Date(last)>7*864e5){b.className='backup-state warn';b.innerHTML='<span class="dot"></span><span>Vincule ou exporte o banco</span>'}else{b.className='backup-state';b.innerHTML=`<span class="dot"></span><span>Backup: ${new Date(last).toLocaleDateString('pt-BR')}</span>`}}
  function renderToday(){const a=activeTasks(),att=a.filter(t=>days(t)<=30||t.status==='in-progress'||t.status==='blocked'),over=a.filter(t=>days(t)<0),soon=a.filter(t=>days(t)>=0&&days(t)<=30),blocked=a.filter(t=>t.status==='blocked'),doing=a.filter(t=>t.status==='in-progress'),focus=att[0];$('#view-today').innerHTML=heading('Hoje','Sua fila pessoal, organizada automaticamente.',`<span class="date-pill">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</span>`)+`<div class="kpis"><div class="kpi" style="--tone:${tone.red}"><span>Vencidas</span><strong>${over.length}</strong><em>PRECISAM DE DECISÃO</em></div><div class="kpi" style="--tone:${tone.amber}"><span>Próximos 30 dias</span><strong>${soon.length}</strong><em>JANELA DE ATENÇÃO</em></div><div class="kpi" style="--tone:${tone.blue}"><span>Em andamento</span><strong>${doing.length}</strong><em>TRABALHO ATIVO</em></div><div class="kpi" style="--tone:${tone.gray}"><span>Bloqueadas</span><strong>${blocked.length}</strong><em>DEPENDÊNCIAS</em></div><div class="kpi" style="--tone:${tone.violet}"><span>Total aberto</span><strong>${a.length}</strong><em>CARTEIRA ATUAL</em></div></div><div class="layout"><div class="panel"><div class="panel-head"><h2>Fila de ação</h2><small>${att.length} itens exigem atenção</small></div><div class="queue">${att.length?att.slice(0,10).map(taskQueue).join(''):empty('Tudo sob controle','Nenhuma demanda exige ação imediata.')}</div></div><div><div class="panel"><div class="panel-head"><h2>Foco recomendado</h2></div><div class="focus">${focus?`<div class="focus-card" data-id="${focus.id}"><span class="label">Comece por aqui</span><h3>${esc(focus.title)}</h3><p>${esc(focus.nextAction||'Defina a próxima ação para esta demanda.')}</p><div class="progress"><i style="width:${focus.progress||0}%"></i></div><div class="focus-buttons"><button class="btn primary small" data-action="start">Iniciar</button><button class="btn small" data-action="edit">Abrir</button></div></div>`:empty('Sem foco pendente','Cadastre uma nova demanda para começar.')}</div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><h2>Dependências</h2><small>${blocked.length}</small></div><div class="blocked-list">${blocked.length?blocked.slice(0,4).map(t=>`<div class="blocked-item"><b>${esc(t.title)}</b><small>${esc(t.blocker||'Bloqueio não informado')}</small></div>`).join(''):empty('Nenhuma bloqueada','Você não depende de terceiros agora.')}</div></div></div></div>`}
  function filters(){return `<div class="toolbar"><select id="statusFilter"><option value="">Todos os status</option><option value="planned">Planejada</option><option value="in-progress">Em andamento</option><option value="review">Aguardando revisão</option><option value="blocked">Bloqueada</option></select><select id="priorityFilter"><option value="">Todas as prioridades</option><option value="high">Alta</option><option value="medium">Média</option><option value="low">Baixa</option></select><select id="projectFilter"><option value="">Todos os projetos</option>${projects().map(p=>`<option>${esc(p)}</option>`).join('')}</select><span class="spacer"></span><button class="btn small" id="exportCsvBtn">Exportar CSV</button></div>`}
  function taskTable(list,showDone=false,paginate=true){if(!list.length)return empty('Nenhuma demanda encontrada','Ajuste os filtros ou cadastre uma nova demanda.');const totalPages=Math.max(1,Math.ceil(list.length/pageSize));tablePage=Math.min(tablePage,totalPages);const visible=paginate?list.slice((tablePage-1)*pageSize,tablePage*pageSize):list;const table=`<div class="table-wrap"><table><thead><tr><th>Demanda</th><th>Projeto</th><th>Status</th><th>Prioridade</th><th>Vencimento</th><th>Progresso</th><th>Próxima ação</th><th></th></tr></thead><tbody>${visible.map(t=>`<tr data-id="${t.id}"><td class="title-cell"><b>${esc(t.title)}</b><small>${esc(t.category||'')}${elapsedMs(t)>0?` · ⏱ ${fmtDuration(elapsedMs(t))}`:''}</small></td><td>${esc(t.project||'—')}</td><td>${statusHtml(t.status)}</td><td>${priorityHtml(t.priority)}</td><td><span class="tag ${dueClass(t)}">${fmt(t.dueDate)}</span><small style="display:block;color:var(--muted);margin-top:5px">${showDone&&t.completedAt?'Concluída '+new Date(t.completedAt).toLocaleDateString('pt-BR'):dueText(t)}</small></td><td><div class="progress" style="width:100px"><i style="width:${t.progress||0}%"></i></div><small>${t.progress||0}%</small></td><td>${esc(t.nextAction||'—')}</td><td><div class="row-actions">${!showDone?`<button class="icon-btn" data-action="start" title="Iniciar cronômetro">▶</button>`:''}<button class="icon-btn" data-action="edit" title="Editar">✎</button>${!showDone?`<button class="icon-btn" data-action="complete" title="Concluir">✓</button>`:''}<button class="icon-btn" data-action="delete" title="Excluir">×</button></div></td></tr>`).join('')}</tbody></table></div>`;if(!paginate)return table;const from=(tablePage-1)*pageSize+1,to=Math.min(tablePage*pageSize,list.length);return table+`<div class="pagination"><small>Exibindo ${from}–${to} de ${list.length}</small><div class="pagination-controls"><select class="page-size" aria-label="Itens por página"><option ${pageSize===10?'selected':''}>10</option><option ${pageSize===25?'selected':''}>25</option><option ${pageSize===50?'selected':''}>50</option></select><button class="btn small" data-page="${tablePage-1}" ${tablePage===1?'disabled':''}>‹ Anterior</button><span>${tablePage} / ${totalPages}</span><button class="btn small" data-page="${tablePage+1}" ${tablePage===totalPages?'disabled':''}>Próxima ›</button></div></div>`}
  function filtered(base){const sf=$('#statusFilter')?.value||'',pf=$('#priorityFilter')?.value||'',prf=$('#projectFilter')?.value||'';return base.filter(t=>(!sf||t.status===sf)&&(!pf||t.priority===pf)&&(!prf||t.project===prf)&&matches(t))}
  function matches(t){const q=search.trim().toLowerCase();return !q||[t.title,t.project,t.category,t.nextAction,t.blocker,t.notes].some(v=>String(v||'').toLowerCase().includes(q))}
  function renderTasks(){const base=activeTasks();$('#view-tasks').innerHTML=heading('Demandas','Todas as suas atividades abertas em uma única carteira.')+filters()+`<div id="taskTableArea">${taskTable(filtered(base))}</div>`;bindFilters(base)}
  function bindFilters(base){['statusFilter','priorityFilter','projectFilter'].forEach(id=>$(`#${id}`)?.addEventListener('change',()=>{tablePage=1;$('#taskTableArea').innerHTML=taskTable(filtered(base))}));$('#exportCsvBtn')?.addEventListener('click',exportCSV)}
  function renderRecurring(){const list=db.tasks.filter(t=>t.recurrence&&t.recurrence!=='none').filter(matches).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));$('#view-recurring').innerHTML=heading('Periódicas','Ao concluir um ciclo, o Orizon Persona cria automaticamente o próximo.')+`<div class="table-wrap"><table><thead><tr><th>Demanda</th><th>Projeto</th><th>Frequência</th><th>Próximo vencimento</th><th>Status</th><th></th></tr></thead><tbody>${list.map(t=>`<tr data-id="${t.id}"><td class="title-cell"><b>${esc(t.title)}</b><small>${esc(t.category)}</small></td><td>${esc(t.project||'—')}</td><td><span class="tag">${labels[t.recurrence]}</span></td><td>${fmt(t.dueDate)}<small style="display:block;color:var(--muted);margin-top:5px">${dueText(t)}</small></td><td>${statusHtml(t.status)}</td><td><button class="icon-btn" data-action="edit">✎</button></td></tr>`).join('')}</tbody></table></div>`}
