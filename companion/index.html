<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Persona • Hoje</title></head>
<body>
<header><div data-tauri-drag-region class="brand">⠿ PERSONA <span>HOJE</span></div><button id="collapse" aria-label="Recolher ou expandir">−</button><button id="hide" aria-label="Manter na bandeja">×</button></header>
<div id="connection" role="status">Selecione o banco vinculado no Persona</div>
<main id="content"><div class="toolbar"><button id="open">Abrir Persona ↗</button><button id="settingsToggle" aria-expanded="false">Ajustes</button></div><div id="plan"></div></main>
<section id="settings" hidden>
  <p>Somente leitura. Selecione o mesmo JSON usado em Configurações → Banco de dados vinculado no Persona.</p>
  <button id="select">Selecionar banco JSON…</button><small id="file"></small>
  <label>URL do Persona <input id="url" type="url" placeholder="https://seu-persona/" autocomplete="off"></label>
  <label><input id="top" type="checkbox"> Sempre no topo</label>
  <label><input id="summary" type="checkbox"> Resumo diário (horário local)</label>
  <label>Horário <input id="time" type="time" value="08:30"></label>
  <p>O modelo atual não tem horários individuais. Manhã e Tarde não geram alarmes.</p>
  <label><input id="autostart" type="checkbox"> Iniciar com o Windows</label>
  <button id="save">Salvar ajustes</button>
</section>
<p id="error" role="alert"></p>
<script type="module" src="/src/main.js"></script>
</body></html>
