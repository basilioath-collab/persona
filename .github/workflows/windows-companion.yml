name: Windows Persona installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        run: npm ci
      - name: Shared rules
        run: npm test
      - name: Native core tests
        run: cargo test --locked --manifest-path companion/src-tauri/Cargo.toml
      - name: Build installer
        run: npm run desktop:build -- --bundles nsis
      - name: Upload installer only (no databases or workspace dump)
        uses: actions/upload-artifact@v4
        with:
          name: Persona-Windows-${{ github.run_number }}
          path: companion/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
